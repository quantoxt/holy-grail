# BTCUSD (broker CFD feed, Just Global BTCUSD.m) M5 fine-tune — 50/50 split.
# Train: first ~50k candles (2025-09-02 → ~2026-02); test half is NEVER touched
# by training — walk-forward validation runs on it separately via validate.py.
# Layout matches the live bot: lookback 512, pred_len 24 (2h horizon on 5m).
data:
  data_path: "../../../data/ohlcv/BTCUSD/5m_train.csv"   # relative to finetune_csv cwd
  lookback_window: 512
  predict_window: 24
  max_context: 512
  clip: 5.0
  train_ratio: 0.95     # of the TRAIN half only
  val_ratio: 0.05
  test_ratio: 0.0

training:
  tokenizer_epochs: 30
  basemodel_epochs: 20
  batch_size: 32        # 8 GB VRAM ceiling (OOMs at 64)
  log_interval: 50
  num_workers: 4
  seed: 42
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

model_paths:
  # start from the public pretrained weights (hub ids — pulled on first run)
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"
  exp_name: "btcusd_m5_5050"
  base_path: "./finetuned/"     # → model/Kronos/finetune_csv/finetuned/btcusd_m5_5050
  base_save_path: ""
  finetuned_tokenizer: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "btcusd_m5_5050"
  description: "BTCUSD broker M5 fine-tune, 50/50 time split, pred_len 24"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
